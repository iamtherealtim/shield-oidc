name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        deps: [latest]
        include:
          # The oldest versions we claim to support
          - php: '8.1'
            deps: lowest
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, json, mbstring, intl, sqlite3
          coverage: none
      # PHP 8.1 and the lowest job resolve to older CodeIgniter releases that have published
      # advisories; Composer 2.9+ refuses those by default. This only affects the test install.
      - name: Allow older framework releases in tests
        if: matrix.php == '8.1'
        run: composer config audit.block-insecure false || true
      - name: Pin lowest supported versions
        if: matrix.deps == 'lowest'
        run: |
          composer require --no-update "codeigniter4/shield:1.1.0"
          composer require --no-update --dev "codeigniter4/framework:4.5.*"
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
